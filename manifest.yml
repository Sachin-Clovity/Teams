remotes:
  - key: ms-graph
    baseUrl: https://graph.microsoft.com
  - key: ms-login
    baseUrl: https://login.microsoftonline.com

permissions:
  external:
    fetch:
      client:
        - address: https://graph.microsoft.com
        - address: https://login.microsoftonline.com
      backend:
        - address: https://graph.microsoft.com
        - address: https://login.microsoftonline.com
        - address: https://outlook.office.com
        - address: https://*.webhook.office.com

  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work

app:
  id: ari:cloud:ecosystem::app/186dd9e7-7cba-4f86-b5df-202440d0aab8
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
