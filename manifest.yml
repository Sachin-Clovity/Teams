modules:
  jira:globalPage:
    - key: connector-app-global-page
      resource: main
      resolver:
        function: resolver
      title: Teams Connector

  trigger:
    - key: jira-issue-trigger
      function: jira-sync
      events:
        - jira:issueCreated
        - jira:issueUpdated
        - jira:issueDeleted

  function:
    - key: resolver
      handler: index.handler
      # providers:      # auth commented — using trigger approach
      #   auth:
      #     - microsoft

    - key: jira-sync
      handler: index.jiraSync

resources:
  - key: main
    path: static/hello-world/build

